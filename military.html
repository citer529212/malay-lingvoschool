<script type="application/json" id="embedded-data">{"texts": [{"id": 1, "section": 1, "kind": "Письменный · MS → RU", "lang": "ms", "body": "Sistem pertahanan udara bersepadu dibentuk untuk mengesan, mengenal pasti dan memintas ancaman dari udara sebelum ancaman itu mencapai sasaran penting.\n\nRangkaian ini menggabungkan radar pengawasan jarak jauh, pusat kawalan, unit peluru berpandu darat ke udara, pesawat pemintas dan unsur peperangan elektronik.\n\nMaklumat daripada semua penderia dihantar ke pusat operasi supaya pegawai bertugas dapat membina gambaran udara yang sama dan membuat keputusan tanpa kelewatan.\n\nKeberkesanan sistem bergantung pada ketepatan pertukaran data. Setiap sasaran diperiksa mengikut arah penerbangan, kelajuan, ketinggian dan kod pengenalan.\n\nJika sebuah pesawat tidak memberikan jawapan yang sah, pusat kawalan akan mengarahkan pesawat pejuang mendekati sasaran untuk pengenalpastian visual.\n\nTindakan tembakan hanya dibenarkan selepas rantaian arahan mengesahkan tahap ancaman dan memastikan bahawa pesawat awam tidak berada di kawasan pemintasan.\n\nDalam keadaan gangguan elektronik, unit radar menggunakan frekuensi sandaran dan menukar kedudukan bagi mengurangkan risiko dikesan. Pasukan teknikal pula memastikan bekalan kuasa, alat ganti dan saluran komunikasi sentiasa tersedia.\n\nLatihan berkala perlu melibatkan semua komponen rangkaian kerana kelemahan pada satu unsur boleh menjejaskan keseluruhan operasi pertahanan udara.", "title": "Письменный · MS → RU · 1", "words": 167}, {"id": 2, "section": 1, "kind": "Письменный · MS → RU", "lang": "ms", "body": "Pesawat tempur Su-30MKM digunakan untuk rondaan udara, pemintasan dan serangan terhadap sasaran darat atau laut. Keupayaan pesawat bergantung bukan sahaja pada sistem senjata, tetapi juga pada penyelenggaraan yang teratur.\n\nSebelum penerbangan, juruteknik memeriksa enjin, sistem hidraulik, avionik, radar, alat komunikasi dan kelengkapan keselamatan juruterbang. Semua keputusan direkodkan dalam dokumen teknikal.\n\nPenyelenggaraan dibahagikan kepada pemeriksaan harian, pemeriksaan selepas sejumlah jam penerbangan dan pembaikan besar. Jika kerosakan dikesan, komponen berkenaan dikeluarkan dan dihantar ke bengkel khusus.\n\nPenggunaan alat ganti yang diperakui penting untuk menjamin kebolehpercayaan pesawat. Dalam iklim tropika, kelembapan tinggi dan udara masin boleh mempercepat kakisan, oleh itu perlindungan permukaan dan pemeriksaan sambungan elektrik diberi perhatian tambahan.\n\nProgram pemodenan biasanya merangkumi kemas kini perisian, peningkatan sistem peperangan elektronik, integrasi peluru berpandu baharu dan pembaharuan peralatan latihan. Namun, setiap perubahan mesti diuji dari segi keselamatan dan keserasian.\n\nKerjasama antara jurutera, juruterbang dan pembekal membolehkan armada mengekalkan kesiagaan tempur serta mengurangkan tempoh pesawat berada di darat.\n\nPengurusan rekod teknikal juga perlu seragam. Setiap kerja, nombor komponen dan keputusan ujian dicatat supaya sejarah pesawat dapat dijejaki. Data ini membantu merancang pembelian alat ganti, menentukan keutamaan pembaikan dan mengelakkan kerosakan berulang.", "title": "Письменный · MS → RU · 2", "words": 186}, {"id": 3, "section": 1, "kind": "Письменный · MS → RU", "lang": "ms", "body": "Kawasan perairan yang luas memerlukan sistem pengawasan maritim yang berterusan. Kapal peronda, pesawat rondaan, radar pantai dan pusat maklumat maritim bekerjasama untuk mengesan pencerobohan, penyeludupan, kegiatan lanun serta ancaman terhadap laluan perdagangan.\n\nData daripada pelbagai agensi perlu disatukan supaya maklumat yang diterima oleh komander tepat dan tidak bercanggah.\n\nKapal peronda moden dilengkapi radar navigasi, sistem pengenalan automatik, kamera elektro-optik dan bot pemintas. Semasa operasi, kru memeriksa identiti kapal, pelabuhan asal, muatan dan laluan pelayaran.\n\nJika terdapat tanda mencurigakan, pasukan pemeriksa dihantar dengan mematuhi langkah keselamatan. Mereka mesti mengawal dokumen, menilai keadaan anak kapal dan memastikan bahawa bahan berbahaya tidak disembunyikan di atas kapal.\n\nKeupayaan rondaan dipengaruhi oleh cuaca, jarak dari pangkalan dan bekalan bahan api. Oleh sebab itu, rancangan operasi merangkumi titik pengisian semula, kawasan perlindungan helikopter dan saluran komunikasi kecemasan.\n\nLatihan bersama antara tentera laut, pengawal pantai dan pihak berkuasa pelabuhan meningkatkan keserasian prosedur serta mempercepat tindak balas terhadap insiden di laut.\n\nDalam keadaan kecemasan, kapal perlu bersedia menerima mangsa, memberikan rawatan awal dan memindahkan mereka ke pelabuhan. Keputusan komander direkodkan dalam log operasi.", "title": "Письменный · MS → RU · 3", "words": 175}, {"id": 4, "section": 1, "kind": "Письменный · MS → RU", "lang": "ms", "body": "Kenderaan udara tanpa pemandu digunakan untuk peninjauan, pembetulan tembakan, pemantauan sempadan dan penghantaran muatan ringan. Dron kecil boleh dilancarkan dengan cepat dan memberikan imej kawasan operasi secara langsung.\n\nWalau bagaimanapun, tempoh penerbangan, cuaca, bentuk muka bumi dan gangguan isyarat mengehadkan penggunaannya. Operator perlu menentukan laluan, ketinggian dan titik pulang sebelum pelancaran.\n\nAncaman dron memerlukan gabungan langkah pengesanan dan penangkisan. Radar jarak dekat, alat pengesan frekuensi radio dan pemerhati visual membantu menentukan arah serta jenis sasaran.\n\nSelepas pengesahan, unit boleh menggunakan gangguan elektronik, senjata ringan, sistem pertahanan udara atau dron pemintas. Pemilihan kaedah bergantung pada lokasi, risiko kepada penduduk dan kemungkinan jatuhnya serpihan.\n\nPasukan mesti menukar frekuensi, menyamarkan kedudukan dan mengehadkan penggunaan pemancar yang tidak perlu. Maklumat tentang dron yang dikesan hendaklah segera disampaikan kepada semua pos.", "title": "Письменный · MS → RU · 4", "words": 126}, {"id": 5, "section": 1, "kind": "Письменный · MS → RU", "lang": "ms", "body": "Angkatan tentera sering membantu pihak berkuasa awam ketika banjir, gempa bumi atau tanah runtuh. Pada peringkat awal, pusat operasi menilai jumlah penduduk terjejas, keadaan jalan, kapasiti hospital dan keperluan segera.\n\nKeutamaan biasanya diberikan kepada pemindahan mangsa, bekalan air bersih, rawatan perubatan dan pembukaan laluan ke kawasan yang terputus.\n\nUnit logistik menyediakan kenderaan, bot, helikopter, khemah, penjana elektrik dan stok makanan. Setiap penghantaran direkodkan supaya bekalan sampai ke pusat agihan yang betul. Jika jambatan rosak, jurutera tentera membina lintasan sementara atau mengukuhkan jalan.\n\nPasukan perubatan mendirikan pos rawatan dan menyelaraskan pemindahan pesakit dengan hospital tempatan.", "title": "Письменный · MS → RU · 5", "words": 94}, {"id": 6, "section": 2, "kind": "Письменный · RU → MS", "lang": "ru", "body": "Ассоциация государств Юго-Восточной Азии объединяет страны с различными политическими системами, уровнями развития и внешнеполитическими приоритетами.\n\nОсновой взаимодействия остаются уважение суверенитета, невмешательство во внутренние дела и поиск решения, приемлемого для всех участников. Консенсус позволяет сохранять единство организации, однако иногда замедляет принятие решений по острым вопросам.\n\nВ этих условиях большое значение имеют предварительные консультации и неформальные встречи. Государства сначала согласуют общие формулировки, а затем закрепляют их в совместных заявлениях.\n\nАСЕАН развивает сотрудничество в сфере экономики, безопасности, образования и ликвидации последствий стихийных бедствий. Организация также создает площадки для диалога с внешними партнерами.\n\nЕе роль особенно заметна тогда, когда необходимо снизить напряженность и не допустить превращения региона в арену соперничества крупных держав.\n\nДля сохранения центральной роли АСЕАН участникам необходимо укреплять собственные институты и выполнять ранее принятые решения. Для оценки эффективности организации важно учитывать не только количество встреч и документов, но и выполнение конкретных проектов.\n\nРегулярный обмен данными, совместная подготовка специалистов и единые процедуры реагирования позволяют превратить политические договоренности в практический результат. При этом решения должны сохранять добровольный характер и учитывать возможности каждого участника.", "title": "Письменный · RU → MS · 1", "words": 169}, {"id": 7, "section": 2, "kind": "Письменный · RU → MS", "lang": "ru", "body": "Внешняя политика Малайзии традиционно сочетает защиту национальных интересов с участием в многосторонней дипломатии. Страна поддерживает отношения с соседями по АСЕАН, ведущими азиатскими державами, государствами исламского мира и партнерами за пределами региона.\n\nПрактический подход позволяет Куала-Лумпуру развивать торговлю и инвестиции, не связывая себя жесткими союзническими обязательствами.\n\nВ вопросах безопасности Малайзия выступает за мирное урегулирование споров, соблюдение международного права и сохранение свободы судоходства. Одновременно государство уделяет внимание защите своих морских границ и исключительной экономической зоны.\n\nМалайзийская дипломатия активно использует механизмы АСЕАН, Организации Объединенных Наций и Организации исламского сотрудничества. Важным направлением остается гуманитарная повестка.\n\nМалайзия принимает участие в миротворческих миссиях, оказывает помощь пострадавшим от бедствий и поддерживает переговорные форматы. Такая политика позволяет стране сохранять самостоятельность и выступать посредником по отдельным региональным вопросам.\n\nПоследовательность внешней политики также зависит от внутренней координации. Позиции министерств, бизнеса, экспертного сообщества и региональных властей должны дополнять друг друга.", "title": "Письменный · RU → MS · 2", "words": 139}, {"id": 8, "section": 2, "kind": "Письменный · RU → MS", "lang": "ru", "body": "Россия и Малайзия развивают отношения в торгово-экономической, образовательной, научной и военно-технической сферах. Взаимный интерес связан с диверсификацией внешних связей, подготовкой специалистов и обменом технологиями.\n\nВажную роль играют прямые контакты между университетами, деловыми объединениями и профильными ведомствами.\n\nМалайзийские специалисты знакомы с российской авиационной техникой, а российские организации заинтересованы в сотрудничестве в области энергетики, цифровых решений и сельского хозяйства.\n\nПерспективным направлением может стать совместная подготовка кадров, включая языковую и профессиональную подготовку. Для расширения связей необходимо улучшать информирование компаний о возможностях рынков, развивать логистику и согласовывать технические требования.\n\nПолитический диалог создает для этого благоприятную основу. При этом обе стороны учитывают международную обстановку и действуют в соответствии со своими национальными интересами.\n\nУстойчивые отношения требуют долгосрочных проектов, регулярных консультаций и практических результатов, заметных для граждан и организаций двух стран.\n\nОтдельное значение имеет подготовка переводчиков, способных работать с военной, технической и общественно-политической терминологией.\n\nКачественное языковое сопровождение снижает риск неверного понимания на переговорах и помогает поддерживать прямые профессиональные контакты. Такие связи формируют доверие даже в сложной международной обстановке.", "title": "Письменный · RU → MS · 3", "words": 161}, {"id": 9, "section": 2, "kind": "Письменный · RU → MS", "lang": "ru", "body": "Миротворческие операции проводятся для снижения уровня насилия, защиты гражданского населения и создания условий для политического урегулирования.\n\nВоеннослужащие могут наблюдать за прекращением огня, патрулировать районы ответственности, сопровождать гуманитарные грузы и обеспечивать безопасность важных объектов.\n\nУспех миссии зависит не только от военной подготовки, но и от понимания местной культуры, умения вести переговоры и соблюдать нейтралитет. Подразделения действуют на основании международного мандата и установленных правил применения силы.\n\nПеред развертыванием личный состав изучает обстановку, проходит языковую подготовку и отрабатывает взаимодействие с полицией, гуманитарными организациями и местными властями. Командиры обязаны постоянно оценивать риски для населения и собственных военнослужащих.\n\nМиротворцы не могут заменить политический процесс, но способны предотвратить новые столкновения и дать сторонам время для переговоров.\n\nПосле завершения операции особенно важна передача ответственности национальным институтам, способным самостоятельно поддерживать безопасность и правопорядок. После завершения миссии необходимо сохранять накопленный опыт.\n\nОтчеты, учебные материалы и разбор конкретных ситуаций используются при подготовке следующего контингента. Это позволяет совершенствовать правила безопасности, взаимодействие с гражданскими организациями и языковую подготовку личного состава.", "title": "Письменный · RU → MS · 4", "words": 158}, {"id": 10, "section": 2, "kind": "Письменный · RU → MS", "lang": "ru", "body": "Морские коммуникации Юго-Восточной Азии имеют мировое значение, поскольку через них проходят крупные потоки сырья, топлива и промышленных товаров. Узкие проливы требуют постоянного контроля движения судов и координации между прибрежными государствами.\n\nК основным угрозам относятся пиратство, контрабанда, аварии, загрязнение моря и незаконный промысел. Для противодействия этим рискам используются патрули, обмен информацией и совместные учения.\n\nОсобое внимание уделяется Малаккскому проливу, где высокая плотность движения повышает вероятность происшествий. Береговые службы отслеживают обстановку с помощью радаров, автоматических систем идентификации и авиации.\n\nПри получении сигнала бедствия ближайшие силы направляются для поиска и спасания. Безопасность судоходства нельзя обеспечить действиями только одной страны. Необходимы согласованные правила связи, совместимые процедуры и доверие между ведомствами.\n\nОдновременно меры контроля должны учитывать нормы международного морского права и не создавать необоснованных препятствий для законной торговли. Совместные центры обмена информацией позволяют быстрее проверять сообщения об угрозах и передавать данные патрульным силам.\n\nИх работа эффективна только при единых форматах доклада и защите информации. Регулярные учения помогают выявлять технические и языковые проблемы до возникновения реального кризиса. Важна также постоянная связь с портами и судоходными компаниями.", "title": "Письменный · RU → MS · 5", "words": 170}, {"id": 11, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Сухопутные войска предназначены для ведения боевых действий на суше. В их состав входят пехотные, бронетанковые, артиллерийские, инженерные, связные и другие подразделения. Пехота захватывает и удерживает районы, ведет наблюдение и взаимодействует с танками.\n\nБронетанковые подразделения обладают высокой подвижностью и огневой мощью. Артиллерия поражает цели на глубине и поддерживает действия войск. В ходе операции командир определяет задачу, боевой порядок, направление основных усилий и порядок взаимодействия.\n\nОсобое внимание уделяется разведке, связи и снабжению. Подразделения должны сохранять управление при изменении обстановки и быть готовыми перейти от наступления к обороне. Перед выдвижением уточняются границы ответственности и сигналы управления.\n\nРазведывательные данные постоянно обновляются. Если подразделение встречает сопротивление, командир вводит резерв или изменяет направление действий. Раненые эвакуируются, а расход боеприпасов и топлива докладывается по установленной форме.\n\nПосле выполнения задачи подразделение закрепляется и готовится к отражению контратаки.", "title": "Последовательный · RU → MS · 1", "words": 129}, {"id": 12, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Подразделения противовоздушной обороны прикрывают войска и важные объекты от ударов с воздуха. Наблюдение ведется радиолокационными станциями и визуальными постами. После обнаружения цели определяются ее курс, скорость и высота.\n\nКомандный пункт распределяет цели между огневыми средствами и передает предупреждение соседним подразделениям. Для поражения могут применяться зенитные ракетные комплексы, артиллерия и средства радиоэлектронной борьбы.\n\nЧтобы избежать поражения собственных самолетов, личный состав строго соблюдает порядок опознавания. Позиции периодически меняются, а работа радиосредств ограничивается установленным режимом.", "title": "Последовательный · RU → MS · 2", "words": 72}, {"id": 13, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Инженерные войска проводят разведку местности, устраивают проходы, оборудуют позиции и восстанавливают дороги. Перед началом действий специалисты оценивают состояние мостов, грунта и водных преград. Если маршрут разрушен, они строят временный мост или организуют объезд.\n\nВ обороне инженерные подразделения создают заграждения, укрытия и ложные позиции. В наступлении они проделывают проходы и обеспечивают движение техники. Все работы выполняются в тесном взаимодействии с охранением.\n\nКомандир устанавливает очередность задач, сроки и потребность в материалах. После завершения работ сведения о маршруте и установленных заграждениях передаются на командный пункт.", "title": "Последовательный · RU → MS · 3", "words": 82}, {"id": 14, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Материально-техническое обеспечение включает доставку боеприпасов, топлива, продовольствия, воды и запасных частей. План снабжения составляется с учетом численности войск, расхода ресурсов, расстояния и состояния дорог.\n\nСклады размещаются так, чтобы сократить время доставки и одновременно снизить риск поражения. Колонны двигаются по согласованным маршрутам под охраной. При поломке техники ремонтная группа определяет, можно ли восстановить машину на месте или требуется эвакуация.", "title": "Последовательный · RU → MS · 4", "words": 58}, {"id": 15, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Управление войсками основывается на непрерывном получении информации, принятии решения и доведении задач до исполнителей. Командный пункт собирает доклады разведки, соседей и подчиненных подразделений. Командир оценивает противника, свои силы, местность и время.\n\nПосле принятия решения издается боевой приказ. Для связи используются радио, проводные линии, спутниковые и курьерские средства. На случай подавления основных каналов назначаются резервные частоты и сигналы.", "title": "Последовательный · RU → MS · 5", "words": 57}, {"id": 16, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Радиоэлектронная борьба включает разведку излучений, подавление систем противника и защиту собственных средств. Специалисты определяют расположение радиостанций, радаров и каналов управления беспилотниками. Затем командир выбирает время и способ воздействия.\n\nАктивные помехи могут нарушить связь или затруднить работу навигационных систем. Одновременно подразделения меняют частоты, используют шифрование и сокращают время передачи. Эффект подавления проверяется по данным разведки.\n\nНеобходимо учитывать, что сильная помеха может повлиять и на собственные средства. Поэтому действия подразделений радиоэлектронной борьбы заранее согласуются с авиацией, артиллерией и силами противовоздушной обороны.", "title": "Последовательный · RU → MS · 6", "words": 79}, {"id": 17, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Беспилотные летательные аппараты применяются для разведки, наблюдения, корректирования огня и доставки небольших грузов. Перед запуском оператор проверяет аппарат, аккумулятор, канал управления и район полета.\n\nМаршрут строится с учетом рельефа, погоды и расположения средств противника. Полученное изображение передается на командный пункт, где аналитик отмечает цели и изменения обстановки. После выполнения задачи аппарат возвращается в заданную точку.\n\nПри появлении помех оператор переходит на резервный канал или включает автоматический режим возвращения. Подразделение должно учитывать угрозу обнаружения по радиосигналу и регулярно менять место запуска.", "title": "Последовательный · RU → MS · 7", "words": 80}, {"id": 18, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Военно-морские силы защищают морские коммуникации, базы и районы экономической деятельности. Корабли ведут наблюдение, сопровождают суда и участвуют в поисково-спасательных операциях.\n\nПеред выходом в море командир проверяет готовность экипажа, запасы топлива, работу навигации и средств связи. В районе операции устанавливаются порядок обмена информацией и правила опознавания.\n\nПри обнаружении неизвестного судна уточняются его курс, скорость и принадлежность. Если судно не отвечает, к нему направляется досмотровая группа. Все действия должны соответствовать международному морскому праву и не создавать угрозу гражданскому судоходству.\n\nПри совместных действиях корабли распределяют зоны наблюдения и назначают общий канал связи. Экипажи регулярно докладывают обстановку и запас топлива. В случае шторма командир меняет строй и снижает скорость.\n\nПри обнаружении угрозы гражданским судам передается предупреждение. После возвращения сведения о контактах заносятся в общую базу данных и передаются дежурной смене.", "title": "Последовательный · RU → MS · 8", "words": 126}, {"id": 19, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Миротворческое подразделение действует на основании мандата и правил применения силы. Его задачи могут включать патрулирование, наблюдение за прекращением огня, охрану гуманитарных объектов и сопровождение колонн.\n\nПеред патрулем личный состав изучает маршрут, угрозы и порядок связи. При общении с населением военнослужащие соблюдают нейтралитет и уважительно относятся к местным обычаям. Любое происшествие немедленно докладывается в штаб.", "title": "Последовательный · RU → MS · 9", "words": 54}, {"id": 20, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Подготовка военных специалистов сочетает теоретические занятия, работу на тренажерах и практические действия с техникой. Сначала обучаемые изучают устройство образца, правила безопасности и порядок обслуживания.\n\nЗатем инструктор показывает основные операции и контролирует их выполнение. На следующем этапе вводятся неисправности и ограничение времени. Особое внимание уделяется единообразию терминологии и точности команд.\n\nПереводчик должен заранее изучить тему, проверить эквиваленты и согласовать сокращения. Итоговая проверка включает самостоятельное выполнение задачи. Результаты используются для определения тем дополнительной подготовки.", "title": "Последовательный · RU → MS · 10", "words": 72}, {"id": 21, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "После сильного наводнения несколько населенных пунктов оказались отрезаны от дорожной сети. Военное подразделение получило задачу эвакуировать жителей и доставить воду, продовольствие и медикаменты.\n\nРазведывательная группа определила безопасные маршруты и места для посадки вертолетов. Инженеры начали укреплять поврежденную дамбу и расчищать дорогу. Медицинский персонал развернул временный пункт помощи.", "title": "Последовательный · RU → MS · 11", "words": 47}, {"id": 22, "section": 3, "kind": "Последовательный · RU → MS", "lang": "ru", "body": "Совместное учение проводится для проверки совместимости штабов и подразделений двух государств. На подготовительном этапе стороны согласуют сценарий, состав сил, языки работы и меры безопасности.\n\nВ ходе учения штаб получает вводные и принимает решение в ограниченное время. Подразделения выполняют марш, организуют связь, проводят поиск условного нарушителя и оказывают помощь пострадавшим. Офицеры связи помогают правильно понимать команды и национальные процедуры.\n\nПосле завершения проводится разбор. Участники отмечают успешные решения, трудности перевода и различия в терминологии. Выводы включаются в план дальнейшей подготовки.\n\nВо время активной фазы наблюдатели фиксируют время получения приказов, устойчивость связи и безопасность действий. Условные происшествия заставляют штаб менять план и запрашивать поддержку.\n\nИтоговый отчет составляется совместно, чтобы выводы не отражали только национальную точку зрения. Особое приложение посвящается общей терминологии, связи и работе переводчиков.", "title": "Последовательный · RU → MS · 12", "words": 122}, {"id": 23, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Dasar pertahanan negara bertujuan melindungi kedaulatan, keutuhan wilayah dan kepentingan strategik. Pertahanan tidak bergantung pada angkatan tentera sahaja. Ia memerlukan kerjasama agensi keselamatan, industri, masyarakat dan rakan antarabangsa.\n\nPerancangan dibuat berdasarkan penilaian ancaman, kemampuan kewangan serta keadaan geografi. Keutamaan diberikan kepada kesiagaan, pengawasan ruang udara dan perairan, keselamatan siber serta keupayaan bantuan bencana.\n\nHubungan pertahanan dengan negara lain dilaksanakan melalui dialog, latihan bersama dan pertukaran pegawai. Semua bentuk kerjasama hendaklah menyokong kepentingan negara dan kestabilan serantau.", "title": "Зрительно-устный · MS → RU · 1", "words": 76}, {"id": 24, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Angkatan Tentera Malaysia terdiri daripada Tentera Darat Malaysia, Tentera Laut Diraja Malaysia dan Tentera Udara Diraja Malaysia. Markas Angkatan Bersama menyelaras operasi yang melibatkan lebih daripada satu perkhidmatan.\n\nSetiap cabang mempunyai tugas khusus, tetapi kejayaan operasi bergantung pada perkongsian maklumat dan sokongan bersama.\n\nTentera Darat melaksanakan operasi di daratan, Tentera Laut menjaga kepentingan maritim, manakala Tentera Udara mengawal ruang udara dan memberikan sokongan udara.\n\nSistem latihan bersama membolehkan anggota memahami prosedur cabang lain dan bertindak sebagai satu pasukan. Rantaian perintah yang jelas membolehkan sumber setiap perkhidmatan digunakan secara berkesan. Keputusan operasi disampaikan melalui pusat kawalan bersama.", "title": "Зрительно-устный · MS → RU · 2", "words": 96}, {"id": 25, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Tentera Darat Malaysia mempertahankan wilayah daratan dan menyokong pihak berkuasa awam apabila diperlukan. Pasukannya merangkumi infantri, armor, artileri, pertahanan udara, jurutera, semboyan dan unsur sokongan.\n\nInfantri boleh bergerak berjalan kaki atau menggunakan kenderaan perisai. Unit armor memberikan daya gerak dan kuasa tembakan, sementara artileri menyerang sasaran pada jarak yang lebih jauh. Dalam operasi, semua unsur disatukan di bawah satu rancangan.\n\nKeupayaan bergerak di hutan, bandar dan kawasan berbukit penting kerana bentuk muka bumi Malaysia sangat pelbagai. Latihan menekankan disiplin, kepimpinan dan penyesuaian kepada keadaan tropika. Unit juga membantu ketika banjir, kebakaran dan kecemasan awam.", "title": "Зрительно-устный · MS → RU · 3", "words": 94}, {"id": 26, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Tentera Laut Diraja Malaysia melindungi perairan negara, laluan perdagangan dan pangkalan laut. Kapal permukaan, kapal selam, pesawat dan unit khas digunakan untuk rondaan, pengawasan dan tindak balas.\n\nPusat operasi menerima data daripada radar pantai serta agensi maritim. Apabila sebuah kapal tidak dikenali dikesan, identiti dan tujuannya diperiksa. Jika perlu, kapal peronda menghampiri dan menjalankan pemeriksaan mengikut prosedur.\n\nSelain tugas tempur, tentera laut terlibat dalam operasi mencari dan menyelamat, bantuan kemanusiaan dan latihan dengan negara sahabat. Keupayaan kapal bergantung pada latihan kru, penyelenggaraan dan bekalan di pangkalan.\n\nSetiap rondaan diakhiri dengan laporan dan analisis kontak yang dikesan.", "title": "Зрительно-устный · MS → RU · 4", "words": 96}, {"id": 27, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Tentera Udara Diraja Malaysia bertanggungjawab mempertahankan ruang udara dan menyokong operasi bersama. Radar pengawasan mengesan pesawat yang menghampiri kawasan tanggungjawab.\n\nPusat kawalan menilai maklumat dan mengarahkan pesawat pemintas jika identiti sasaran tidak dapat dipastikan. Pesawat pengangkut pula membawa anggota, bekalan dan mangsa yang memerlukan rawatan.\n\nHelikopter digunakan untuk mencari dan menyelamat serta menyokong pasukan darat. Kesiagaan bergantung pada penyelenggaraan pesawat, latihan juruterbang, keselamatan pangkalan dan komunikasi yang stabil.\n\nLatihan bersama cabang lain menguji panduan sasaran, penghantaran udara dan pemindahan perubatan. Semua penerbangan tertakluk pada peraturan keselamatan yang ketat.", "title": "Зрительно-устный · MS → RU · 5", "words": 88}, {"id": 28, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Anggota pengaman menjalankan tugas dalam persekitaran yang sensitif dan perlu mengekalkan sikap berkecuali. Mereka memantau gencatan senjata, meronda kawasan tanggungjawab dan melindungi penghantaran bantuan.\n\nSebelum misi, anggota mempelajari budaya tempatan, arahan operasi dan peraturan penggunaan kekerasan. Hubungan dengan penduduk dibina melalui komunikasi yang sopan dan tindakan yang konsisten. Sebarang pelanggaran atau ancaman dilaporkan melalui rantaian perintah.\n\nMatlamat utama bukan untuk memenangi konflik, tetapi untuk mewujudkan keadaan yang membolehkan proses politik dan pemulihan berjalan. Penterjemah dan pegawai perhubungan membantu mengelakkan salah faham.\n\nLaporan rondaan menjadi asas untuk menilai keselamatan dan keperluan penduduk.", "title": "Зрительно-устный · MS → RU · 6", "words": 91}, {"id": 29, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Kerjasama pertahanan ASEAN memberi tumpuan kepada pembinaan keyakinan, pertukaran maklumat dan peningkatan keupayaan bersama. Mesyuarat Menteri-Menteri Pertahanan ASEAN menyediakan ruang untuk membincangkan keselamatan maritim, keganasan, bencana dan keselamatan siber.\n\nLatihan bersama membantu menyelaraskan prosedur mencari dan menyelamat serta bantuan kemanusiaan. Prinsip konsensus memastikan setiap negara mengambil bahagian secara sukarela.\n\nWalaupun kepentingan nasional berbeza, kerjasama praktikal dapat mengurangkan salah faham dan memperkukuh kestabilan di rantau ini. Kerjasama ini tidak menggantikan dasar pertahanan negara.\n\nSebaliknya, ia membina saluran komunikasi dan pengalaman yang boleh digunakan ketika krisis sebenar.", "title": "Зрительно-устный · MS → RU · 7", "words": 85}, {"id": 30, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Selat Melaka ialah salah satu laluan perkapalan terpenting di dunia. Banyak kapal dagang dan kapal tangki melalui kawasan yang sempit ini setiap hari.\n\nNegara pantai menjalankan rondaan, berkongsi maklumat dan menyelaras tindakan terhadap lanun, penyeludupan serta kemalangan. Pusat pemantauan menggunakan radar dan sistem pengenalan automatik untuk menilai pergerakan kapal.\n\nJika berlaku insiden, pasukan terdekat memberikan bantuan dan memberi amaran kepada kapal lain. Keselamatan selat memerlukan keseimbangan antara kawalan yang berkesan, kebebasan pelayaran dan penghormatan terhadap kedaulatan negara pantai.\n\nLatihan berkala menguji komunikasi antara kapal, pusat pantai dan pasukan udara. Maklumat insiden disimpan untuk memperbaiki prosedur bersama.", "title": "Зрительно-устный · MS → RU · 8", "words": 96}, {"id": 31, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Pertahanan siber melindungi rangkaian, pangkalan data dan sistem kawalan daripada pencerobohan. Ancaman boleh datang melalui e-mel palsu, perisian berbahaya, kelemahan kata laluan atau peranti yang tidak dikawal.\n\nSetiap anggota wajib mematuhi peraturan keselamatan, mengemas kini perisian dan melaporkan kegiatan luar biasa. Pusat operasi siber memantau rangkaian dan mengasingkan bahagian yang terjejas. Selepas serangan, pakar menentukan sumber, kaedah dan tahap kerosakan.\n\nLatihan berkala penting kerana teknologi berubah dengan cepat dan kesilapan manusia masih menjadi salah satu risiko utama. Salinan sandaran dan kawalan akses mengehadkan kerosakan. Disiplin pengguna sama pentingnya dengan peralatan teknikal yang canggih.", "title": "Зрительно-устный · MS → RU · 9", "words": 93}, {"id": 32, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Perkhidmatan perubatan tentera menyediakan rawatan dari lokasi kecederaan hingga hospital. Pertolongan pertama bertujuan menghentikan pendarahan, memastikan pernafasan dan mencegah keadaan mangsa menjadi lebih buruk.\n\nSelepas itu, mangsa dipindahkan ke pos perubatan untuk pemeriksaan lanjut. Keutamaan pemindahan ditentukan berdasarkan tahap kecederaan, bukan pangkat. Kenderaan dan laluan pemindahan dirancang lebih awal.\n\nDalam iklim panas, anggota perubatan juga memantau dehidrasi, keletihan haba dan penyakit berjangkit. Rekod yang tepat membantu meneruskan rawatan di setiap peringkat. Latihan simulasi memastikan setiap anggota mengetahui tugas ketika berlaku ramai mangsa.", "title": "Зрительно-устный · MS → RU · 10", "words": 82}, {"id": 33, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Rantaian bekalan tentera menghubungkan gudang, pusat pengangkutan dan unit di kawasan operasi. Bekalan utama termasuk makanan, air, bahan api, peluru, ubat dan alat ganti. Pegawai logistik mengira kadar penggunaan serta menentukan masa penghantaran.\n\nUntuk mengurangkan risiko, bekalan boleh diagihkan ke beberapa lokasi dan dihantar melalui laluan yang berbeza. Setiap penerimaan direkodkan dan baki stok dilaporkan. Jika keadaan berubah, keutamaan penghantaran disemak semula.\n\nSistem yang baik membolehkan unit terus beroperasi walaupun jarak jauh dan cuaca sukar. Keadaan jalan dan ancaman menentukan jenis kenderaan serta masa bergerak. Rancangan sandaran disediakan bagi setiap penghantaran penting.", "title": "Зрительно-устный · MS → RU · 11", "words": 92}, {"id": 34, "section": 4, "kind": "Зрительно-устный · MS → RU", "lang": "ms", "body": "Operasi mencari dan menyelamat bermula apabila pusat penyelarasan menerima maklumat tentang pesawat, kapal atau individu yang hilang. Maklumat terakhir mengenai lokasi, masa dan keadaan cuaca digunakan untuk menentukan kawasan carian.\n\nPesawat, kapal dan pasukan darat dibahagikan kepada sektor. Semua unsur melaporkan kedudukan dan hasil pemerhatian pada masa yang ditetapkan. Apabila mangsa ditemui, pasukan menilai keadaannya dan memilih cara pemindahan yang paling selamat.\n\nSelepas operasi, laporan lengkap disediakan bagi menilai keberkesanan komunikasi, peralatan dan keputusan yang telah dibuat. Keselamatan penyelamat diberi keutamaan kerana cuaca dan medan boleh berubah.\n\nMaklumat yang tepat kepada keluarga mengurangkan khabar angin dan kekeliruan.", "title": "Зрительно-устный · MS → RU · 12", "words": 97}], "dialogs": [{"id": 1, "pairs": [{"ru": "По каким признакам классифицируются управляемые ракеты?", "ms": "Mengikut ciri apakah peluru berpandu berpandu dikelaskan?"}, {"ru": "Их классифицируют по назначению, дальности, траектории, типу боевой части и способу базирования.", "ms": "Peluru berpandu itu dikelaskan mengikut tujuan, jarak, trajektori, jenis kepala peledak dan kaedah penempatan."}, {"ru": "Какие категории выделяются по дальности?", "ms": "Apakah kategori yang dibezakan mengikut jarak?"}, {"ru": "Обычно выделяют ракеты малой, средней и большой дальности.", "ms": "Biasanya peluru berpandu jarak dekat, sederhana dan jauh dibezakan."}, {"ru": "Чем отличается баллистическая ракета от крылатой?", "ms": "Apakah perbezaan antara peluru berpandu balistik dengan peluru berpandu itle": "Что понимается под радиоэлектронной борьбой?"}, {"id": 3, "pairs": [{"ru": "Какие рода войск входят в состав сухопутных войск?", "ms": "Apakah kor yang terdapat dalam pasukan darat?"}, {"ru": "Пехота, бронетанковые войска, артиллерия, ПВО, инженеры, связь и другие силы обеспечения.", "ms": "Infantri, kor armor, artileri, pertahanan udara, jurutera, semboyan dan unsur sokongan lain."}, {"ru": "Какова основная задача пехоты?", "ms": "Apakah tugas utama infantri?"}, {"ru": "Она захватывает и удерживает районы, уничтожает противника и действует на сложной местности.", "ms": "Infantri menawan dan mempertahankan kawasan, memusnahkan pihak lawan serta beroperasi di medan yang sukar."}, {"ru": "Почему необходимо взаимодействие с танками?", "ms": "Mengapakah kerjasama dengan kereta kebal diperlukan?"}, {"ru": "Танки дают огневую мощь и защиту, а пехота прикрывает их от близких угроз.", "ms": "Kereta kebal memberikan kuasa tembakan dan perlindungan, manakala infantri melindunginya daripada ancaman jarak dekat."}, {"ru": "Какую роль играет артиллерия?", "ms": "Apakah peranan artileri?"}], "title": "Какие рода войск входят в состав сухопутных войск?"}, {"id": 4, "pairs": [{"ru": "Какие задачи танки выполняют в обороне?", "ms": "Apakah tugas kereta kebal dalam pertahanan?"}, {"ru": "Они поражают бронетехнику и живую силу, поддерживают пехоту и участвуют в контратаках.", "ms": "Kereta kebal memusnahkan kenderaan perisai dan anggota lawan, menyokong infantri serta terlibat dalam serangan balas."}, {"ru": "Какие основные характеристики танка учитываются?", "ms": "Apakah ciri utama kereta kebal yang diambil kira?"}, {"ru": "Огневая мощь, защищенность, подвижность, запас хода и надежность.", "ms": "Kuasa tembakan, perlindungan, mobiliti, jarak operasi dan kebolehpercayaan."}, {"ru": "От чего зависит проходимость?", "ms": "Apakah yang menentukan keupayaan merentas medan?"}, {"ru": "От массы, мощности двигателя, ходовой части, грунта и подготовки экипажа.", "ms": "Ia bergantung pada berat, kuasa enjin, sistem gerak, keadaan tanah dan latihan kru."}, {"ru": "Как танк защищается от дронов?", "ms": "Bagaimanakah kereta kebal dilindungi daripada dron?"}, {"ru": "Применяются маскировка, средства РЭБ, дополнительная защита и взаимодействие с ПВО.", "ms": "Penyamaran, sistem peperangan elektronik, perlindungan tambahan dan kerjasama dengan pertahanan udara digunakan."}], "title": "Какие задачи танки выполняют в обороне?"}, {"id": 5, "pairs": [{"ru": "Как классифицируется артиллерия?", "ms": "Bagaimanakah artileri dikelaskan?"}, {"ru": "По назначению, калибру, способу передвижения и характеру траектории.", "ms": "Artileri dikelaskan mengikut tujuan, kaliber, kaedah pergerakan dan bentuk trajektori."}, {"ru": "Чем пушка отличается от гаубицы?", "ms": "Apakah perbezaan antara meriam dengan howitzer?"}, {"ru": "Пушка обычно имеет более длинный ствол и настильную траекторию, гаубица может вести огонь по навесной траектории.", "ms": "Meriam biasanya mempunyai laras yang lebih panjang dan trajektori mendatar, manakala howitzer boleh menembak dengan trajektori melengkung."}, {"ru": "Как осуществляется корректирование огня?", "ms": "Bagaimanakah tembakan dilaraskan?"}, {"ru": "Наблюдатель сообщает отклонение разрывов, после чего вычисляются поправки.", "ms": "Pemerhati melaporkan sisihan letupan, kemudian pembetulan dikira."}, {"ru": "Какие данные нужны для стрельбы?", "ms": "Apakah data yang diperlukan untuk tembakan?"}, {"ru": "Координаты цели и огневой позиции, тип боеприпаса, погода и ограничения безопасности.", "ms": "Koordinat sasaran dan kedudukan tembakan, jenis peluru, cuaca serta sekatan keselamatan."}], "title": "Как классифицируется артиллерия?"}, {"id": 6, "pairs": [{"ru": "Как строится дежурство сил ПВО?", "ms": "Bagaimanakah tugas siap siaga pertahanan udara diatur?"}, {"ru": "Назначаются дежурные расчеты, готовые средства поражения и резервные каналы связи.", "ms": "Kru bertugas, sistem pemintas yang sedia digunakan dan saluran komunikasi sandaran ditetapkan."}, {"ru": "Что происходит после обнаружения цели?", "ms": "Apakah yang berlaku selepas sasaran dikesan?"}, {"ru": "Уточняются параметры движения, принадлежность и степень угрозы.", "ms": "Parameter pergerakan, identiti dan tahap ancaman dipastikan."}, {"ru": "Когда поднимаются истребители?", "ms": "Bilakah pesawat pejuang diarahkan berlepas?"}, {"ru": "Когда требуется перехват или визуальное опознавание неизвестной цели.", "ms": "Apabila pemintasan atau pengenalpastian visual sasaran tidak dikenali diperlukan."}], "title": "Как строится дежурство сил ПВО?"}, {"id": 7, "pairs": [{"ru": "Какие задачи выполняет военная авиация?", "ms": "Apakah tugas penerbangan tentera?"}, {"ru": "Она ведет разведку, поражает цели, перевозит войска и грузы, выполняет поиск и спасание.", "ms": "Ia menjalankan peninjauan, menyerang sasaran, mengangkut anggota dan muatan serta melaksanakan operasi mencari dan menyelamat."}, {"ru": "От чего зависит боевой радиус?", "ms": "Apakah yang menentukan radius tempur?"}, {"ru": "От запаса топлива, нагрузки, высоты полета, погоды и профиля задания.", "ms": "Ia bergantung pada bahan api, muatan, ketinggian, cuaca dan profil misi."}, {"ru": "Как готовится экипаж?", "ms": "Bagaimanakah kru membuat persiapan?"}, {"ru": "Он изучает задачу, маршрут, угрозы, запасные аэродромы и порядок связи.", "ms": "Kru mengkaji misi, laluan, ancaman, lapangan terbang alternatif dan prosedur komunikasi."}, {"ru": "Что проверяет инженерно-технический состав?", "ms": "Apakah yang diperiksa oleh anggota kejuruteraan?"}, {"ru": "Двигатель, топливную систему, авионику, вооружение и аварийное оборудование.", "ms": "Enjin, sistem bahan api, avionik, persenjataan dan peralatan kecemasan diperiksa."}], "title": "Какие задачи выполняет военная авиация?"}, {"id": 8, "pairs": [{"ru": "Какие задачи решают инженерные войска?", "ms": "Apakah tugas pasukan jurutera?"}, {"ru": "Они ведут инженерную разведку, оборудуют позиции, строят переправы и устраивают проходы.", "ms": "Mereka menjalankan peninjauan kejuruteraan, menyediakan kedudukan, membina lintasan dan membuka laluan."}, {"ru": "Что проверяется при разведке маршрута?", "ms": "Apakah yang diperiksa semasa peninjauan laluan?"}, {"ru": "Ширина дороги, грузоподъемность мостов, состояние грунта и наличие препятствий.", "ms": "Lebar jalan, kapasiti jambatan, keadaan tanah dan kewujudan halangan diperiksa."}, {"ru": "Как обозначается безопасный проход?", "ms": "Bagaimanakah laluan selamat ditandakan?"}, {"ru": "Он обозначается установленными знаками и передается на карту командира.", "ms": "Laluan itu ditandakan dengan tanda yang ditetapkan dan dicatat pada peta komander."}, {"ru": "Какие средства применяются на водной преграде?", "ms": "Apakah peralatan yang digunakan di halangan air?"}, {"ru": "Понтонные мосты, паромы, лодки и инженерные машины.", "ms": "Jambatan pontun, feri, bot dan kenderaan kejuruteraan digunakan."}], "title": "Какие задачи решают инженерные войска?"}, {"id": 9, "pairs": [{"ru": "Какова цель совместного морского патрулирования?", "ms": "Apakah tujuan rondaan maritim bersama?"}, {"ru": "Повысить наблюдение, обмен информацией и согласованность действий против общих угроз.", "ms": "Untuk meningkatkan pengawasan, pertukaran maklumat dan penyelarasan tindakan terhadap ancaman bersama."}, {"ru": "Какие процедуры согласуются заранее?", "ms": "Apakah prosedur yang diselaraskan terlebih dahulu?"}, {"ru": "Связь, опознавание, районы патрулирования, помощь терпящим бедствие и порядок сближения.", "ms": "Komunikasi, pengenalan, kawasan rondaan, bantuan kecemasan dan prosedur mendekati kapal diselaraskan."}, {"ru": "Кто руководит операцией?", "ms": "Siapakah yang mengetuai operasi?"}, {"ru": "Стороны назначают координационный центр и офицеров связи.", "ms": "Kedua-dua pihak menetapkan pusat penyelarasan dan pegawai perhubungan."}, {"ru": "Как учитывается гражданское судоходство?", "ms": "Bagaimanakah pelayaran awam diambil kira?"}, {"ru": "Маршруты планируются так, чтобы не создавать опасности и необоснованных ограничений.", "ms": "Laluan dirancang supaya tidak menimbulkan bahaya atau sekatan yang tidak wajar."}], "title": "Какова цель совместного морского патрулирования?"}, {"id": 10, "pairs": [{"ru": "Как оценивается состояние самолетов Су-30МКМ?", "ms": "Bagaimanakah keadaan pesawat Su-30MKM dinilai?"}, {"ru": "Проверяются ресурс планера, двигатели, авионика, радиолокационная станция и обеспеченность запасными частями.", "ms": "Jangka hayat struktur pesawat, enjin, avionik, radar dan bekalan alat ganti diperiksa."}, {"ru": "Какие направления модернизации приоритетны?", "ms": "Apakah bidang pemodenan yang diberi keutamaan?"}, {"ru": "Связь, система предупреждения, радиоэлектронная защита и совместимость нового вооружения.", "ms": "Komunikasi, sistem amaran, perlindungan elektronik dan keserasian persenjataan baharu."}, {"ru": "Нужно ли менять все оборудование одновременно?", "ms": "Adakah semua peralatan perlu diganti serentak?"}, {"ru": "Нет, работы можно проводить поэтапно с учетом бюджета и готовности самолетов.", "ms": "Tidak, kerja boleh dilaksanakan secara berperingkat mengikut peruntukan dan kesiagaan pesawat."}, {"ru": "Как готовится технический персонал?", "ms": "Bagaimanakah kakitangan teknikal dilatih?"}, {"ru": "Он проходит теоретический курс, работу на тренажерах и практику под руководством инструкторов.", "ms": "Mereka mengikuti kursus teori, latihan simulator dan amali di bawah penyeliaan tenaga pengajar."}], "title": "Как оценивается состояние самолетов Су-30МКМ?"}, {"id": 11, "pairs": [{"ru": "Какова основная цель совместного учения?", "ms": "Apakah tujuan utama latihan bersama?"}, {"ru": "Проверить взаимодействие штабов и подразделений при выполнении общей задачи.", "ms": "Untuk menguji kerjasama markas dan unit dalam melaksanakan tugas bersama."}, {"ru": "Что согласуется на подготовительном этапе?", "ms": "Apakah yang diselaraskan pada peringkat persediaan?"}, {"ru": "Сценарий, состав участников, связь, терминология, безопасность и медицинское обеспечение.", "ms": "Senario, peserta, komunikasi, istilah, keselamatan dan sokongan perubatan diselaraskan."}, {"ru": "Какую роль играют переводчики?", "ms": "Apakah peranan jurubahasa?"}, {"ru": "Они обеспечивают точную передачу приказов, докладов и профессиональной терминологии.", "ms": "Mereka memastikan arahan, laporan dan istilah profesional disampaikan dengan tepat."}, {"ru": "Какие трудности возникают чаще всего?", "ms": "Apakah kesukaran yang paling kerap timbul?"}, {"ru": "Различия в процедурах, сокращениях, темпе работы и порядке принятия решений.", "ms": "Perbezaan prosedur, singkatan, tempo kerja dan proses membuat keputusan."}], "title": "Какова основная цель совместного учения?"}], "topics": [{"id": 1, "title": "Isu semasa dalam agenda antarabangsa", "text": "Agenda antarabangsa semasa dibentuk oleh persaingan kuasa besar, konflik serantau, perubahan teknologi dan cabaran ekonomi. Negara perlu melindungi kepentingan sendiri, tetapi pada masa yang sama bergantung pada perdagangan, tenaga, kewangan dan rantaian bekalan global. Oleh itu, keputusan dasar luar jarang terhad kepada satu bidang sahaja.\n\nBagi negara Asia Tenggara, kestabilan serantau dan kebebasan memilih rakan kerjasama sangat penting. Ketegangan antara kuasa besar boleh mempengaruhi pelaburan, keselamatan maritim dan hubungan diplomatik. Negara ASEAN biasanya menekankan dialog, undang-undang antarabangsa dan penyelesaian pertikaian secara aman.\n\nDalam perbincangan, perlu membezakan fakta, penilaian dan ramalan. Hujah yang baik menyatakan kepentingan pihak terlibat, menjelaskan risiko dan menawarkan beberapa pilihan tindakan. Kesimpulan harus menunjukkan bagaimana perkembangan antarabangsa memberi kesan kepada Malaysia dan rantau Asia Tenggara.", "vocab": [{"ms": "agenda antarabangsa", "ru": "международная повестка"}, {"ms": "persaingan kuasa besar", "ru": "соперничество великих держав"}, {"ms": "rantaian bekalan", "ru": "цепочка поставок"}, {"ms": "kepentingan negara", "ru": "национальные интересы"}, {"ms": "penyelesaian secara aman", "ru": "мирное урегулирование"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 2, "title": "ASEAN dan kerjasama serantau", "text": "ASEAN ditubuhkan untuk menggalakkan keamanan, kestabilan dan pembangunan di Asia Tenggara. Anggotanya berbeza dari segi saiz, sistem politik dan tahap ekonomi. Walaupun begitu, mereka menggunakan prinsip konsensus, tidak campur tangan dan saling menghormati kedaulatan sebagai asas hubungan.\n\nKerjasama merangkumi perdagangan, pengangkutan, pendidikan, kesihatan, keselamatan maritim dan bantuan bencana. Melalui forum yang diterajui ASEAN, negara anggota juga berdialog dengan kuasa luar. Konsep kepusatan ASEAN bermaksud organisasi itu berusaha kekal sebagai penggerak utama seni bina serantau.\n\nKekuatan ASEAN ialah keupayaannya mengekalkan komunikasi antara pihak yang berbeza. Kelemahannya ialah proses membuat keputusan boleh menjadi lambat. Masa depan organisasi bergantung pada pelaksanaan keputusan, pengurangan jurang pembangunan dan keupayaan bertindak balas terhadap krisis.", "vocab": [{"ms": "negara anggota", "ru": "государство-член"}, {"ms": "prinsip konsensus", "ru": "принцип консенсуса"}, {"ms": "tidak campur tangan", "ru": "невмешательство"}, {"ms": "kepusatan ASEAN", "ru": "центральная роль АСЕАН"}, {"ms": "seni bina serantau", "ru": "региональная архитектура"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 3, "title": "Pertubuhan Bangsa-Bangsa Bersatu", "text": "Pertubuhan Bangsa-Bangsa Bersatu menyediakan kerangka universal untuk membincangkan keamanan, pembangunan, hak asasi manusia dan bantuan kemanusiaan. Perhimpunan Agung memberi ruang kepada semua negara anggota, manakala Majlis Keselamatan memikul tanggungjawab utama terhadap keamanan antarabangsa.\n\nOperasi pengaman membantu memantau gencatan senjata, melindungi orang awam dan menyokong proses politik. Kejayaan misi bergantung pada mandat yang jelas, sumber yang mencukupi dan kerjasama pihak tempatan. PBB juga menyelaras bantuan ketika bencana dan konflik.\n\nOrganisasi ini sering dikritik kerana perbezaan kepentingan antara negara dan kesukaran melaksanakan keputusan. Namun, PBB kekal sebagai tempat utama untuk merundingkan norma bersama. Malaysia menyokong multilateralisme dan mengambil bahagian dalam misi pengaman serta perbahasan antarabangsa.", "vocab": [{"ms": "Pertubuhan Bangsa-Bangsa Bersatu", "ru": "Организация Объединённых Наций"}, {"ms": "Majlis Keselamatan", "ru": "Совет Безопасности"}, {"ms": "mandat", "ru": "мандат"}, {"ms": "gencatan senjata", "ru": "прекращение огня"}, {"ms": "operasi pengaman", "ru": "миротворческая операция"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 4, "title": "Peperangan hibrid", "text": "Peperangan hibrid menggabungkan tekanan ketenteraan dan bukan ketenteraan. Antara instrumennya ialah operasi maklumat, serangan siber, tekanan ekonomi, penggunaan kumpulan proksi dan tindakan tentera yang terhad. Matlamatnya boleh berupa perubahan tingkah laku pihak lawan tanpa pengisytiharan perang secara rasmi.\n\nKesukaran utama ialah pengenalpastian sumber tindakan. Serangan siber atau kempen maklumat boleh dilakukan melalui pelbagai perantara. Keadaan ini melambatkan tindak balas dan meningkatkan risiko salah tafsir. Masyarakat yang berpecah serta institusi yang lemah lebih mudah dipengaruhi.\n\nPertahanan terhadap ancaman hibrid memerlukan keselamatan siber, komunikasi kerajaan yang boleh dipercayai, perlindungan infrastruktur kritikal dan pendidikan media. Tindakan mesti berasaskan undang-undang supaya langkah keselamatan tidak merosakkan kepercayaan masyarakat.", "vocab": [{"ms": "peperangan hibrid", "ru": "гибридная война"}, {"ms": "operasi maklumat", "ru": "информационная операция"}, {"ms": "kumpulan proksi", "ru": "прокси-группа"}, {"ms": "infrastruktur kritikal", "ru": "критическая инфраструктура"}, {"ms": "pengenalpastian sumber", "ru": "атрибуция источника"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 5, "title": "Perang dan konflik", "text": "Konflik bersenjata boleh berpunca daripada pertikaian wilayah, persaingan politik, ketidaksamaan, identiti atau campur tangan luar. Setiap konflik mempunyai sejarah dan pihak yang tersendiri. Oleh itu, penjelasan yang terlalu mudah sering mengabaikan kepentingan sebenar dan perubahan yang berlaku dari masa ke masa.\n\nUndang-undang kemanusiaan antarabangsa menetapkan perlindungan bagi orang awam, tawanan dan mangsa yang cedera. Pihak bertelagah perlu membezakan sasaran tentera daripada objek awam dan mengelakkan penggunaan kekerasan yang berlebihan. Pelanggaran undang-undang meningkatkan penderitaan dan menyukarkan perdamaian.\n\nPenyelesaian konflik memerlukan gabungan langkah keselamatan dan politik. Gencatan senjata boleh menghentikan pertempuran buat sementara, tetapi keamanan berkekalan memerlukan perjanjian, jaminan, pembinaan semula dan mekanisme untuk menyelesaikan pertikaian.", "vocab": [{"ms": "konflik bersenjata", "ru": "вооружённый конфликт"}, {"ms": "pihak bertelagah", "ru": "сторона конфликта"}, {"ms": "undang-undang kemanusiaan", "ru": "гуманитарное право"}, {"ms": "orang awam", "ru": "гражданское население"}, {"ms": "keamanan berkekalan", "ru": "устойчивый мир"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 6, "title": "Peranan Malaysia di arena antarabangsa", "text": "Malaysia ialah negara perdagangan yang terletak di persimpangan laluan maritim penting. Kepentingan ini mempengaruhi dasar luarnya. Malaysia berusaha mengekalkan hubungan baik dengan pelbagai rakan, menyokong ASEAN dan mempertahankan kebebasan membuat keputusan.\n\nNegara ini mengambil bahagian dalam PBB, ASEAN, Pertubuhan Kerjasama Islam dan forum ekonomi. Malaysia sering menekankan isu pembangunan, Palestin, keamanan serantau dan kerjasama antara negara membangun. Penglibatan dalam operasi pengaman menunjukkan sumbangan praktikal kepada keselamatan antarabangsa.\n\nPengaruh Malaysia tidak hanya bergantung pada saiz ekonomi atau kekuatan tentera. Kedudukan geografi, pengalaman diplomasi, hubungan budaya dan kemampuan menjadi pengantara juga penting. Cabarannya ialah mengekalkan keseimbangan apabila persaingan kuasa besar meningkat.", "vocab": [{"ms": "arena antarabangsa", "ru": "международная арена"}, {"ms": "dasar luar", "ru": "внешняя политика"}, {"ms": "negara perdagangan", "ru": "торговое государство"}, {"ms": "pengantara", "ru": "посредник"}, {"ms": "kebebasan membuat keputusan", "ru": "самостоятельность принятия решений"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 7, "title": "Kerjasama ketenteraan Rusia dan Malaysia", "text": "Kerjasama ketenteraan Rusia dan Malaysia berkembang melalui hubungan rasmi, pameran pertahanan, pendidikan dan sokongan teknikal. Pengalaman Malaysia mengendalikan pesawat buatan Rusia mewujudkan keperluan jangka panjang terhadap penyelenggaraan, alat ganti dan latihan kakitangan.\n\nKerjasama yang mampan memerlukan kontrak yang jelas, jadual bekalan yang boleh dipercayai dan pemindahan pengetahuan. Latihan bersama atau pertukaran pegawai boleh meningkatkan persefahaman, tetapi perlu mengambil kira doktrin, istilah dan prosedur yang berbeza.\n\nBidang yang berpotensi termasuk penerbangan, pertahanan udara, latihan bahasa, perubatan tentera dan bantuan bencana. Setiap projek hendaklah dinilai berdasarkan keperluan operasi, kos sepanjang hayat dan kepentingan kedua-dua negara.", "vocab": [{"ms": "kerjasama ketenteraan", "ru": "военное сотрудничество"}, {"ms": "sokongan teknikal", "ru": "техническое сопровождение"}, {"ms": "alat ganti", "ru": "запасные части"}, {"ms": "pemindahan pengetahuan", "ru": "передача знаний"}, {"ms": "kos sepanjang hayat", "ru": "стоимость жизненного цикла"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 8, "title": "Kedudukan geopolitik Malaysia", "text": "Malaysia terdiri daripada wilayah di Semenanjung Tanah Melayu serta Sabah dan Sarawak di pulau Borneo. Negara ini menghadap Selat Melaka dan Laut China Selatan. Kedudukan tersebut memberi kelebihan perdagangan, tetapi juga menimbulkan tanggungjawab besar terhadap keselamatan maritim.\n\nMalaysia berjiran dengan beberapa negara ASEAN dan berada berhampiran laluan tenaga dunia. Sebarang ketegangan di perairan serantau boleh menjejaskan ekonomi dan keselamatan. Oleh itu, pengawasan sempadan, diplomasi dan kerjasama dengan jiran saling melengkapi.\n\nDalam persaingan kuasa besar, Malaysia biasanya mengelakkan pilihan yang terlalu berpihak. Negara berusaha memanfaatkan perdagangan dan teknologi daripada pelbagai rakan sambil mempertahankan kedaulatan serta kepusatan ASEAN.", "vocab": [{"ms": "kedudukan geopolitik", "ru": "геополитическое положение"}, {"ms": "Semenanjung Tanah Melayu", "ru": "Малайский полуостров"}, {"ms": "sempadan maritim", "ru": "морская граница"}, {"ms": "laluan tenaga", "ru": "энергетический маршрут"}, {"ms": "kedaulatan", "ru": "суверенитет"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 9, "title": "Peranan Rusia dalam susunan dunia", "text": "Rusia ialah sebuah negara besar Eurasia, anggota tetap Majlis Keselamatan PBB dan kuasa nuklear. Kedudukan geografinya menghubungkan Eropah, Asia, Artik dan kawasan Pasifik. Faktor-faktor ini menjadikan Rusia peserta penting dalam isu keselamatan, tenaga dan pengangkutan antarabangsa.\n\nRusia menekankan kedaulatan, keseimbangan kuasa dan pembentukan susunan dunia berbilang pusat. Hubungannya dengan negara Asia berkembang melalui perdagangan, diplomasi, pendidikan dan kerjasama keselamatan. Pada masa yang sama, hubungan dengan negara Barat dipengaruhi oleh konflik dan sekatan.\n\nUntuk menilai peranan Rusia, perlu mempertimbangkan sumber kuasa, kepentingan, hubungan dengan rakan dan kesan tindakannya terhadap rantau lain. Analisis harus membezakan pandangan rasmi, reaksi negara lain dan hasil praktikal.", "vocab": [{"ms": "susunan dunia", "ru": "мировой порядок"}, {"ms": "anggota tetap", "ru": "постоянный член"}, {"ms": "kuasa nuklear", "ru": "ядерная держава"}, {"ms": "keseimbangan kuasa", "ru": "баланс сил"}, {"ms": "dunia berbilang pusat", "ru": "многополярный мир"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 10, "title": "Cabaran dan ancaman abad ke-21", "text": "Ancaman moden merangkumi konflik bersenjata, keganasan, jenayah rentas sempadan, serangan siber, wabak, bencana dan perubahan iklim. Banyak ancaman saling berkaitan. Sebagai contoh, bencana boleh merosakkan infrastruktur, menyebabkan perpindahan penduduk dan membuka ruang kepada kegiatan jenayah.\n\nTeknologi meningkatkan kemampuan negara, tetapi juga mencipta kerentanan baharu. Dron murah, kecerdasan buatan dan maklumat palsu boleh digunakan oleh pelaku negara dan bukan negara. Sistem penting perlu dilindungi tanpa menghalang inovasi dan pertukaran maklumat yang sah.\n\nTiada negara dapat menangani semua cabaran secara bersendirian. Kerjasama antarabangsa, kesiapsiagaan nasional dan masyarakat yang berdaya tahan perlu dibangunkan serentak. Keutamaan ditentukan melalui penilaian risiko, bukan hanya berdasarkan perhatian media.", "vocab": [{"ms": "ancaman rentas sempadan", "ru": "трансграничная угроза"}, {"ms": "serangan siber", "ru": "кибератака"}, {"ms": "maklumat palsu", "ru": "ложная информация"}, {"ms": "penilaian risiko", "ru": "оценка риска"}, {"ms": "masyarakat berdaya tahan", "ru": "устойчивое общество"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 11, "title": "Geografi dan penduduk Malaysia", "text": "Malaysia mempunyai dua kawasan utama yang dipisahkan oleh Laut China Selatan. Malaysia Barat terletak di Semenanjung Tanah Melayu, manakala Malaysia Timur merangkumi Sabah dan Sarawak. Bentuk muka bumi terdiri daripada dataran pantai, banjaran, hutan tropika dan sungai.\n\nIklim Malaysia panas dan lembap sepanjang tahun serta dipengaruhi monsun. Hujan lebat boleh menyebabkan banjir dan tanah runtuh. Geografi mempengaruhi penempatan penduduk, pertanian, pengangkutan dan perancangan ketenteraan.\n\nPenduduk Malaysia berbilang etnik, bahasa dan agama. Bahasa Melayu ialah bahasa kebangsaan, sementara bahasa lain juga digunakan dalam masyarakat. Kepelbagaian ini merupakan sumber budaya dan ekonomi, tetapi memerlukan dasar yang menyokong perpaduan serta peluang yang seimbang.", "vocab": [{"ms": "bentuk muka bumi", "ru": "рельеф"}, {"ms": "banjaran", "ru": "горный хребет"}, {"ms": "hutan tropika", "ru": "тропический лес"}, {"ms": "bahasa kebangsaan", "ru": "национальный язык"}, {"ms": "masyarakat berbilang etnik", "ru": "многоэтническое общество"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 12, "title": "Sistem negara dan politik Malaysia", "text": "Malaysia ialah sebuah persekutuan dan mengamalkan sistem raja berperlembagaan serta demokrasi berparlimen. Yang di-Pertuan Agong ialah Ketua Utama Negara. Kerajaan Persekutuan diketuai oleh Perdana Menteri yang mendapat sokongan majoriti di Dewan Rakyat.\n\nParlimen terdiri daripada Dewan Rakyat dan Dewan Negara. Undang-undang dibincangkan dan diluluskan melalui proses perundangan. Negeri-negeri mempunyai kerajaan dan bidang kuasa tertentu. Pembahagian kuasa antara persekutuan dan negeri penting bagi pentadbiran negara.\n\nPilihan raya memberi peluang kepada rakyat memilih wakil. Institusi kehakiman, perkhidmatan awam dan media turut mempengaruhi kehidupan politik. Dalam penerangan sistem politik, perlu menggunakan istilah rasmi dan membezakan fungsi institusi.", "vocab": [{"ms": "raja berperlembagaan", "ru": "конституционная монархия"}, {"ms": "demokrasi berparlimen", "ru": "парламентская демократия"}, {"ms": "Kerajaan Persekutuan", "ru": "федеральное правительство"}, {"ms": "Dewan Rakyat", "ru": "Палата представителей"}, {"ms": "bidang kuasa", "ru": "полномочия"}], "questions": ["Apakah idea utama topik ini?", "Apakah kepentingannya bagi Malaysia?", "Apakah risiko utama?", "Apakah bentuk kerjasama yang sesuai?"]}, {"id": 13, "title": "Ekonomi negara Malaysia", "text": "Ekonomi Malaysia menggabungkan industri pembuatan, perkhidmatan, perdagangan, tenaga dan pertanian. Negara menjadi sebahagian penting rantaian bekalan elektronik serantau. Pelabuhan dan lapangan terbang menyokong perdagangan antarabangsa, sementara perusahaan kecil menyediakan banyak peluang pekerjaan.\n\nMinyak, gas dan minyak sawit kekal penting, tetapi kerajaan juga menggalakkan ekonomi digital, teknologi hijau dan industri bernilai tinggi. Pendidikan dan latihan profesional diperlukan supaya tenaga kerja dapat memenuhi keperluan baharu.\n\nCabaran ekonomi termasuk ketidaktentuan permintaan dunia, kos sara hidup, jurang pembangunan antara wilayah dan keperluan meningkatkan produktiviti. Dasar yang seimbang perlu menarik pelaburan, melindungi golongan rentan dan memastikan pertumbuhan mampan.", "vocab": [{"ms": "industri pembuatan", "ru": "обрабатывающая пром <script>
'use strict';
const D=JSON.parse(document.getElementById('embedded-data').textContent);
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=x=>esc(x).replace(/\n/g,'<br>');
const KEY='malay-gia-2026-v2', OLD='malay-gia-2026-v1';
const blank=()=>({view:'home',filter:0,item:1,drafts:{},done:{},grades:{},errors:{},dialog:1,dialogDir:'ru',topic:1,search:'',deck:'all',card:0,flip:false,cardDir:'ms',cardMode:'due',mastery:{},quiz:null,quizHistory:[],exam:null,examHistory:[],examSection:1,examStrict:true});
let state=blank(),storageOK=true;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object')state={...state,...v};else{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old&&typeof old==='object'){for(const k of ['drafts','done','grades','filter','item','dialog','topic','search','deck','card'])if(old[k]!==undefined)state[k]=old[k];}}}catch(e){storageOK=false;}sanitize();}
function sanitize(){for(const k of ['drafts','done','grades','errors','mastery'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))state[k]={};for(const k of ['examHistory','quizHistory'])if(!Array.isArray(state[k]))state[k]=[];if(!['home','translate','dialog','topics','words','cards','quiz','exam','progress','news'].includes(state.view))state.view='home';if(!D.texts.some(x=>x.id===+state.item))state.item=1;if(!['all',...D.topics.map(t=>String(t.id))].includes(String(state.deck)))state.deck='all';if(!['ms','ru'].includes(state.cardDir))state.cardDir='ms';if(!['due','all'].includes(state.cardMode))state.cardMode='due';if(!['ms','ru'].includes(state.dialogDir))state.dialogDir='ru';if(state.exam&&(!Array.isArray(state.exam.ids)||!state.exam.ids.every(id=>D.texts.some(x=>x.id===id))||!Number.isFinite(state.exam.started)))state.exam=null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;showToast('Не удалось сохранить данные. Экспортируйте резервную копию.');}}
function showToast(msg){const n=$('#toast');if(n){n.textContent=msg;n.hidden=false;clearTimeout(showToast.t);showToast.t=setTimeout(()=>n.hidden=true,3500)}}
const views=['home','translate','dialog','topics','words','cards','quiz','exam','progress','news'];
const labels=['Обзор','Перевод','Диалоги','Темы','Словарь','Карточки','Тест','Экзамен','Прогресс','Новости и перевод'];
function nav(){$('#nav').innerHTML=`<label class="mobile-nav" for="mobileSection">Раздел<select aria-label="Учебный раздел" class="input" id="mobileSection">${labels.map((label,i)=>`<option value="${views[i]}" ${state.view===views[i]?'selected':''}>${label}</option>`).join('')}</select></label>`+labels.map((v,i)=>`<button type="button" data-nav="${views[i]}" class="${state.view===views[i]?'on':''}" ${state.view===views[i]?'aria-current="page"':''}>${v}</button>`).join('')}
function go(v){if(!views.includes(v))return;state.view=v;save();render();window.scrollTo(0,0)}
function head(a,b=''){return `<div class="pagehead"><h1>${esc(a)}</h1>${b?`<p class="muted">${esc(b)}</p>`:''}</div>`}
function btn(text,id,cls=''){return `<button type="button" class="btn ${cls}" id="${id}">${text}</button>`}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}

function home(){const done=D.texts.filter(x=>state.done['t'+x.id]).length;return head('Военный перевод · подготовка к ГИА','Письменный и устный перевод, диалоги, словарь и экзаменационная практика.')+`<section class="pane schoolhero"><div class="sub">SELAMAT DATANG · ДОБРО ПОЖАЛОВАТЬ</div><h2>Практика перевода<br>и подготовка к ГИА.</h2><p>Военные и общественно-политические тексты, диалоги, карточки и письменный экзамен.</p><button class="btn primary" data-go="news">Открыть новости и перевод →</button></section>`+`<div class="stats"><div class="stat"><strong>${D.texts.length}</strong><span>текста для перевода</span></div><div class="stat"><strong>${D.dialogs.length}</strong><span>диалогов</span></div><div class="stat"><strong>${D.topics.length}</strong><span>тем беседы</span></div><div class="stat"><strong>${D.terms.length}</strong><span>терминов</span></div></div><div class="pane notice"><strong>Формат письменной ГИА:</strong> два перевода — с малайского на русский и с русского на малайский, суммарное время 120 минут, словарь разрешён. В разделе «Экзамен» эти два задания выдаются вместе.<p class="mini muted" style="margin:8px 0 0">Устные задания и практическое задание оцениваются отдельно. Автоматическая проверка свободного перевода без эталона не предусмотрена.</p></div><details class="pane"><summary>Требования к устной части ГИА и критерии письменного перевода</summary><p style="margin-top:14px">Устная часть включает зрительно-устный перевод с малайского на русский (700–900 знаков), последовательный перевод с русского на малайский (1000–1200 знаков), двусторонний диалог из 5–6 вопросов и ответов, беседу на малайском языке и практическое задание. На подготовку практического задания отводится до 20 минут.</p><p>В критериях письменного перевода смысловая ошибка равна 1 условной ошибке; неточность, грамматическая и лексическая ошибки — по 0,3; стилистическая — 0,25; орфографическая или пунктуационная — 0,2. Официальную оценку определяет экзаменационная комиссия.</p>< function decodeText(v){const d=new DOMParser().parseFromString(String(v),'text/html');return d.body.textContent||''}

function drawNews(){const list=$('#newsList');if(!list)return;if($('#newsSwipe'))$('#newsSwipe').hidden=!liveNews.length;list.innerHTML=liveNews.map((n,i)=>`<article class="newsitem"><p class="sub">${esc(n.date?new Date(n.date).toLocaleString('ru-RU'):'Дата не указана')}</p><h3 lang="ms">${esc(n.title)}</h3><p lang="ms">${esc(n.summary)}</p><div class="controls"><button class="btn small" data-news="${i}">В перевод →</button>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">Оригинал ↗</a>`:''}</div></article>`).join('');$$('[data-news]').forEach(b=>b.onclick=()=>{if(translating)return;const n=liveNews[+b.dataset.news];work={source:n.title+'\n\n'+n.summary,target:'',dir:'ms',title:n.title,url:n.url};saveWork();render();$('#assistSource').scrollIntoView({behavior:'smooth',block:'center'});showToast('Анонс добавлен. Полный текст можно вставить из оригинала.')})}
function bindWorkshop(){if(state.view!=='news')return;drawNews();const updateFallback=()=>{$('#googleFallback').href='https://translate.google.com/?sl='+work.dir+'&tl='+(work.dir==='ms'?'ru':'ms')+'&text='+encodeURIComponent(work.source)+'&op=translate'};updateFallback();$('#assistSource').oninput=e=>{work.source=e.target.value;saveWork();updateFallback();$('#sourceCount').textContent=wordsCount(work.source)+' слов · '+work.source.length+' / 8000 знаков'};$('#assistTarget').oninput=e=>{work.target=e.target.value;saveWork()};$('#assistDir').onchange=e=>{work.dir=e.target.value;saveWork();updateFallback();$('#assistSource').lang=work.dir;$('#assistTarget').lang=work.dir==='ms'?'ru':'ms'};$('#uploadText').onclick=()=>$('#textFile').click();$('#textFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>100000){showToast('Файл слишком большой. Максимум 100 КБ.');return}const t=await f.text();if(t.length>8000){showToast('Максимум 8000 знаков. Разделите текст на части.');return}work.source=t;work.target='';work.title=f.name;work.url='';saveWork();render()};$('#clearWork').onclick=()=>{if(!confirm('Очистить исходный текст и перевод?'))return;work={source:'',target:'',dir:work.dir,title:'',url:''};saveWork();render()};$('#copyTranslation').onclick=()=>copy(work.target);$('#downloadTranslation').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([work.source+'\n\n--- Перевод ---\n\n'+work.target],{type:'text/plain;charset=utf-8'}));a.download='malay-translation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('#findTerms').onclick=()=>{const field=work.dir==='ru'?'ru':'ms',q=work.source.toLocaleLowerCase();const found=D.terms.filter(t=>q.includes(t[field].toLocaleLowerCase()));$('#termHints').innerHTML='<h3 style="margin-top:20px">Учебный словарь</h3>'+ (found.length?found.map(t=>`<div class="termrow"><b>${esc(t.ms)}</b><span>${esc(t.ru)}</span></div>`).join(''):'<p class="muted">Совпадений в учебном словаре нет. Попробуйте поиск на вкладке «Словарь».</p>')};$('#refreshNews').onclick=loadFreshNews;$('#runTranslation').onclick=runTranslation;}
async function loadFreshNews(){const b=$('#refreshNews'),status=$('#newsStatus');b.disabled=true;status.textContent='Загружаем новости…';try{const r=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Лента временно недоступна. Откройте сайт источника или загрузите свой текст.');const data=await r.json(),cat=$('#newsCategory').value;liveNews=(data.feeds[cat]?.items||[]).slice(0,12).map(n=>({...n,url:safeLink(n.url)}));if(!liveNews.length)throw Error('Для этого раздела пока нет новостей. Выберите другой раздел.');drawNews();status.textContent='Подборка обновлена: '+new Date(data.feeds[cat].updated).toLocaleString('ru-RU')+' · '+liveNews.length+' новостей';}catch(e){status.textContent=e.message}finally{b.disabled=false}}

function segments(s){const out=[];for(const paragraph of s.split(/\n+/).filter(x=>x.trim())){let current='';for(const token of paragraph.match(/\S+\s*/g)||[]){if(new TextEncoder().encode(current+token).length>480&&current){out.push(current.trim());current=''}for(const c of token){if(new TextEncoder().encode(current+c).length>480){out.push(current.trim());current=''}current+=c}}if(current.trim())out.push(current.trim())}return out}
async function runTranslation(){if(translating)return;if(!work.source.trim()){showToast('Добавьте исходный текст.');return}translating=true;const source=work.source,dir=work.dir;const controls=$$('#app button, #app select, #app textarea, #nav button, #mobileSection');controls.forEach(b=>b.disabled=true);const status=$('#assistStatus'),target=$('#assistTarget');const chunks=segments(source);let results=[];try{for(let i=0;i<chunks.length;i++){status.textContent=`Переводим фрагмент ${i+1} из ${chunks.length}…`;const endpoint=new URL('https://api.mymemory.translated.net/get');endpoint.searchParams.set('q',chunks[i]);endpoint.searchParams.set('langpair',dir+'|'+(dir==='ms'?'ru':'ms'));const r=await fetch(endpoint,{signal:AbortSignal.timeout(25000)});if(r.status===429)throw Error('Исчерпан суточный лимит MyMemory. Откройте текст в Google Переводчике.');if(!r.ok)throw Error('Сервис перевода временно недоступен. Используйте Google Переводчик.');const data=await r.json();if(Number(data.responseStatus)!==200||data.quotaFinished||!data.responseData?.translatedText)throw Error('Сервис не выполнил перевод. Используйте Google Переводчик.');results.push(decodeText(data.responseData.translatedText));}work.target=results.join('\n\n');target.value=work.target;saveWork();status.textContent='Черновик готов. Проверьте перевод и отредактируйте его справа.'}catch(e){status.textContent=e.message+' Ваш исходный текст и прежний перевод сохранены.'}finally{translating=false;controls.forEach(b=>b.disabled=false)}}

load();const section=new URLSearchParams(location.search).get('section');if(views.includes(section))state.view=section;$('#theme').onclick=()=>{const v=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('malay-theme',v)}catch(e){}};try{document.documentElement.setAttribute('data-theme',localStorage.getItem('malay-theme')||'dark')}catch(e){};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();showToast('Работа сохранена.')}if(e.key==='Escape'&&$('#toast'))$('#toast').hidden=true});render();setInterval(updateTimer,1000);
