<script>
'use strict';
const D=JSON.parse(document.getElementById('embedded-data').textContent);
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=x=>esc(x).replace(/\n/g,'<br>');
const KEY='indonesian-gia-2026-v2', OLD='indonesian-gia-2026-v1';
const blank=()=>({view:'home',filter:0,item:1,drafts:{},done:{},grades:{},errors:{},dialog:1,dialogDir:'ru',topic:1,search:'',deck:'all',card:0,flip:false,cardDir:'id',cardMode:'due',mastery:{},quiz:null,quizHistory:[],exam:null,examHistory:[],examSection:1,examStrict:true});
let state=blank(),storageOK=true;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object')state={...state,...v};else{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old&&typeof old==='object'){for(const k of ['drafts','done','grades','filter','item','dialog','topic','search','deck','card'])if(old[k]!==undefined)state[k]=old[k];}}}catch(e){storageOK=false;}sanitize();}
function sanitize(){for(const k of ['drafts','done','grades','errors','mastery'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))state[k]={};for(const k of ['examHistory','quizHistory'])if(!Array.isArray(state[k]))state[k]=[];if(!['home','translate','dialog','topics','words','cards','quiz','exam','progress','news'].includes(state.view))state.view='home';if(!D.texts.some(x=>x.id===+state.item))state.item=1;if(!['all',...D.topics.map(t=>String(t.id))].includes(String(state.deck)))state.deck='all';if(!['id','ru'].includes(state.cardDir))state.cardDir='id';if(!['due','all'].includes(state.cardMode))state.cardMode='due';if(!['id','ru'].includes(state.dialogDir))state.dialogDir='ru';if(state.exam&&(!Array.isArray(state.exam.ids)||!state.exam.ids.every(id=>D.texts.some(x=>x.id===id))||!Number.isFinite(state.exam.started)))state.exam=null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;showToast('Не удалось сохранить данные. Экспортируйте резервную копию.');}}
function showToast(msg){const n=$('#toast');if(n){n.textContent=msg;n.hidden=false;clearTimeout(showToast.t);showToast.t=setTimeout(()=>n.hidden=true,3500)}}
const views=['home','translate','dialog','topics','words','cards','quiz','exam','progress','news'];
const labels=['Обзор','Перевод','Диалоги','Темы','Словарь','Карточки','Тест','Экзамен','Прогресс','Новости и перевод'];
function nav(){$('#nav').innerHTML=`<label class="mobile-nav" for="mobileSection">Раздел<select aria-label="Учебный раздел" class="input" id="mobileSection">${labels.map((label,i)=>`<option value="${views[i]}" ${state.view===views[i]?'selected':''}>${label}</option>`).join('')}</select></label>`+labels.map((v,i)=>`<button type="button" data-nav="${views[i]}" class="${state.view===views[i]?'on':''}" ${state.view===views[i]?'aria-current="page"':''}>${v}</button>`).join('')}
function go(v){if(!views.includes(v))return;state.view=v;save();render();window.scrollTo(0,0)}
function head(a,b=''){return `<div class="pagehead"><h1>${esc(a)}</h1>${b?`<p class="muted">${esc(b)}</p>`:''}</div>`}
function btn(text,id,cls=''){return `<button type="button" class="btn ${cls}" id="${id}">${text}</button>`}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function wordsCount(s){return s.trim()?s.trim().split(/\s+/).length:0}
function home(){const done=D.texts.filter(x=>state.done['t'+x.id]).length;return head('Военный перевод · подготовка к ГИА','Письменный и устный перевод, диалоги, словарь и экзаменационная практика.')+`<section class="pane schoolhero"><div class="sub">SELAMAT DATANG · ДОБРО ПОЖАЛОВАТЬ</div><h2>Практика перевода<br>и подготовка к ГИА.</h2><p>Военные и общественно-политические тексты, диалоги, карточки и письменный экзамен.</p><button class="btn primary" data-go="news">Открыть новости и перевод →</button></section>`+`<div class="stats"><div class="stat"><strong>${D.texts.length}</strong><span>текста для перевода</span></div><div class="stat"><strong>${D.dialogs.length}</strong><span>диалогов</span></div><div class="stat"><strong>${D.topics.length}</strong><span>тем беседы</span></div><div class="stat"><strong>${D.terms.length}</strong><span>терминов</span></div></div><div class="pane notice">Учебный режим: два направления перевода и таймер 120 минут. Это тренировочный шаблон; требования к индонезийскому экзамену и материалы будут подключены после получения от вас.</div><div class="cards">${[['news','Новости и перевод','Свежая лента, загрузка текстов и помощник ID ↔ RU'],['translate','Практика перевода','16 коротких заданий, черновики, самопроверка по критериям ГИА'],['dialog','Двусторонние диалоги','Скрытие реплик и тренировка в обоих направлениях'],['topics','Темы устной беседы','4 учебных темы с вопросами и лексикой'],['words','Тематический словарь','Поиск по 26 выражениям'],['cards','Карточки','Повторение сложных слов по расписанию'],['quiz','Тест по лексике','10 заданий, результаты и работа над ошибками'],['exam','Письменный экзамен','Два текста и единый таймер 120 минут'],['progress','Прогресс и резервная копия','Сводка, история экзаменов, импорт и экспорт']].map(([id,t,d])=>`<button class="item" data-go="${id}"><strong>${t} <span aria-hidden="true">→</span></strong><span class="muted">${d}</span></button>`).join('')}</div>`}
const kinds={1:'Письменный ID → RU',2:'Письменный RU → ID',3:'Последовательный RU → ID',4:'Зрительно-устный ID → RU'};
function sectionSelect(id,selected,all=false){return `<select class="input" id="${id}" aria-label="Вид задания">${all?'<option value="0">Все задания</option>':''}${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${+selected===+k?'selected':''}>${v}</option>`).join('')}</select>`}
function errorSummary(e){const w=[1,.3,.3,.3,.25,.2];return w.reduce((s,n,i)=>s+n*(Math.max(0,Number(e?.[i])||0)),0)}
function errorFields(id){const e=state.errors[id]||[0,0,0,0,0,0],names=['Смысловые (× 1)','Неточности (× 0,3)','Грамматические (× 0,3)','Лексические (× 0,3)','Стилистические (× 0,25)','Орфография / пунктуация (× 0,2)'];return `<div class="errorgrid">${names.map((n,i)=>`<label>${n}<input class="input error-input" type="number" min="0" max="99" step="1" data-error="${i}" value="${Math.max(0,Number(e[i])||0)}"></label>`).join('')}</div><p class="mini" id="errorTotal">Суммарно: <b>${errorSummary(e).toFixed(2).replace('.',',')}</b> условных ошибок. Количество ошибок указывается вручную.</p>`}

if($('#startQuiz'))$('#startQuiz').onclick=startQuiz;if($('#newQuiz'))$('#newQuiz').onclick=()=>{state.quiz=null;save();render()};if($('#toCards'))$('#toCards').onclick=()=>go('cards');$$('[data-option]').forEach(b=>b.onclick=()=>{const q=state.quiz,it=q.items[q.index];if(it.chosen!==null)return;it.chosen=+b.dataset.option;if(it.chosen===it.answer)q.score++;else{const m=state.mastery[it.key]||{level:0};state.mastery[it.key]={level:0,next:0,seen:(m.seen||0)+1}}save();render()});if($('#nextQuestion'))$('#nextQuestion').onclick=()=>{const q=state.quiz;q.index++;if(q.index===q.items.length){state.quizHistory.unshift({date:new Date().toISOString(),score:q.score,total:q.items.length});state.quizHistory=state.quizHistory.slice(0,100)}save();render()};

$$('[data-open]').forEach(b=>b.onclick=()=>{state.item=+b.dataset.open;state.filter=0;go('translate')});if($('#export'))$('#export').onclick=()=>download('indonesian-gia-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,exported:new Date().toISOString(),state},null,2));if($('#import'))$('#import').onclick=()=>$('#importFile').click();if($('#importFile'))$('#importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Слишком большой файл');const v=JSON.parse(await file.text()),data=v.version===2?v.state:v;if(!data||typeof data!=='object'||!data.drafts||typeof data.drafts!=='object')throw Error('Неверный формат');if(!confirm('Заменить текущий прогресс данными из файла?'))return;state={...blank(),...data};sanitize();save();render();showToast('Резервная копия импортирована.')}catch(err){showToast('Не удалось импортировать: '+err.message)}};if($('#reset'))$('#reset').onclick=()=>{if(confirm('Удалить все сохранённые работы, результаты и историю?')){state=blank();save();render()}};
}

let liveNews=[],work={source:'',target:'',dir:'id',title:'',url:''},translating=false;
try{work={...work,...JSON.parse(localStorage.getItem('indonesian-workshop')||'{}')}}catch{}
function saveWork(){try{localStorage.setItem('indonesian-workshop',JSON.stringify(work))}catch{showToast('Не удалось сохранить мастерскую. Скачайте результат.')}}
function news(){return head('Новости и перевод','Читайте индонезийские новости, загружайте свои тексты и создавайте перевод с подсказками.')+`
<section class="pane"><div class="worktop"><h2>Лента Bahasa Indonesia</h2><span class="pill">ANTARA · RSS</span></div><div class="controls"><label class="toolbarlabel">Раздел <select class="input" id="newsCategory"><option value="latest">Последние новости</option><option value="international">Мир</option><option value="politics">Политика</option><option value="business">Экономика</option></select></label><button class="btn primary" id="refreshNews">Загрузить свежие новости</button><a class="btn" href="https://www.antaranews.com/" target="_blank" rel="noopener">Сайт источника ↗</a></div><p class="mini muted" id="newsStatus" role="status">Лента обновляется каждый час. Нажмите кнопку, чтобы получить последнюю сохранённую подборку.</p><div id="newsList" class="newslist"></div><p class="news-swipe" style="display:none" id="newsSwipe" hidden>Листайте новости влево и вправо ↔</p></section>
<section class="pane"><div class="worktop"><h2>Мастерская перевода</h2><span class="pill">ID ↔ RU</span></div><div class="controls"><label class="toolbarlabel">Направление <select class="input" id="assistDir"><option value="id" ${work.dir==='id'?'selected':''}>Индонезийский → русский</option><option value="ru" ${work.dir==='ru'?'selected':''}>Русский → индонезийский</option></select></label><button class="btn" id="uploadText">Загрузить .txt</button><input type="file" id="textFile" accept=".txt,text/plain" hidden><button class="btn" id="clearWork">Очистить</button></div>
<p class="mini muted" id="workSource">${work.title?esc(work.title):'Вставьте статью или загрузите UTF-8 файл. Черновик сохраняется в этом браузере.'} ${work.url?`<a href="${esc(work.url)}" target="_blank" rel="noopener">Источник ↗</a>`:''}</p>
<div class="grid workarea"><div><label for="assistSource">Исходный текст</label><textarea class="answer" id="assistSource" maxlength="8000" placeholder="Masukkan teks di sini… / Вставьте текст…" lang="${work.dir}">${esc(work.source)}</textarea><p class="mini muted" id="sourceCount">${wordsCount(work.source)} слов · ${work.source.length} / 8000 знаков</p></div><div><label for="assistTarget">Перевод · можно редактировать</label><textarea class="answer" id="assistTarget" placeholder="Напишите свой перевод или получите черновик помощника…" lang="${work.dir==='id'?'ru':'id'}">${esc(work.target)}</textarea><div class="controls"><button class="btn" id="copyTranslation">Скопировать</button><button class="btn" id="downloadTranslation">Скачать .txt</button></div></div></div>
<div class="controls"><button class="btn primary" id="runTranslation">Перевести текст</button><button class="btn" id="findTerms">Подсказать термины</button><a class="btn" id="googleFallback" href="https://translate.google.com/?sl=id&amp;tl=ru&amp;op=translate" target="_blank" rel="noopener">Открыть в Google Переводчике ↗</a></div><p id="assistStatus" class="mini muted" role="status"></p><details class="mini muted"><summary>О помощнике и передаче текста</summary><p>По кнопке «Перевести текст» исходный текст отправляется внешнему сервису MyMemory. Машинный перевод — черновик для редактирования; проверьте термины, имена и числа. У бесплатного сервиса есть суточные ограничения. Подсказки из учебного словаря работают локально.</p><a href="https://mymemory.translated.net/doc/spec.php" target="_blank" rel="noopener">Документация MyMemory ↗</a></details><div id="termHints"></div></section>`}
function decodeText(v){const d=new DOMParser().parseFromString(String(v),'text/html');return d.body.textContent||''}
function safeLink(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}}
function drawNews(){const list=$('#newsList');if(!list)return;if($('#newsSwipe'))$('#newsSwipe').hidden=!liveNews.length;list.innerHTML=liveNews.map((n,i)=>`<article class="newsitem"><p class="sub">${esc(n.date?new Date(n.date).toLocaleString('ru-RU'):'Дата не указана')}</p><h3 lang="id">${esc(n.title)}</h3><p lang="id">${esc(n.summary)}</p><div class="controls"><button class="btn small" data-news="${i}">В перевод →</button>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">Оригинал ↗</a>`:''}</div></article>`).join('');$$('[data-news]').forEach(b=>b.onclick=()=>{if(translating)return;const n=liveNews[+b.dataset.news];work={source:n.title+'\n\n'+n.summary,target:'',dir:'id',title:n.title,url:n.url};saveWork();render();$('#assistSource').scrollIntoView({behavior:'smooth',block:'center'});showToast('Анонс добавлен. Полный текст можно вставить из оригинала.')})}
function bindWorkshop(){if(state.view!=='news')return;drawNews();const updateFallback=()=>{$('#googleFallback').href='https://translate.google.com/?sl='+work.dir+'&tl='+(work.dir==='id'?'ru':'id')+'&text='+encodeURIComponent(work.source)+'&op=translate'};updateFallback();$('#assistSource').oninput=e=>{work.source=e.target.value;saveWork();updateFallback();$('#sourceCount').textContent=wordsCount(work.source)+' слов · '+work.source.length+' / 8000 знаков'};$('#assistTarget').oninput=e=>{work.target=e.target.value;saveWork()};$('#assistDir').onchange=e=>{work.dir=e.target.value;saveWork();updateFallback();$('#assistSource').lang=work.dir;$('#assistTarget').lang=work.dir==='id'?'ru':'id'};$('#uploadText').onclick=()=>$('#textFile').click();$('#textFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>100000){showToast('Файл слишком большой. Максимум 100 КБ.');return}const t=await f.text();if(t.length>8000){showToast('Максимум 8000 знаков. Разделите текст на части.');return}work.source=t;work.target='';work.title=f.name;work.url='';saveWork();render()};$('#clearWork').onclick=()=>{if(!confirm('Очистить исходный текст и перевод?'))return;work={source:'',target:'',dir:work.dir,title:'',url:''};saveWork();render()};$('#copyTranslation').onclick=()=>copy(work.target);$('#downloadTranslation').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([work.source+'\n\n--- Перевод ---\n\n'+work.target],{type:'text/plain;charset=utf-8'}));a.download='indonesian-translation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('#findTerms').onclick=()=>{const field=work.dir==='ru'?'ru':'id',q=work.source.toLocaleLowerCase();const found=D.terms.filter(t=>q.includes(t[field].toLocaleLowerCase()));$('#termHints').innerHTML='<h3 style="margin-top:20px">Учебный словарь</h3>'+ (found.length?found.map(t=>`<div class="termrow"><b>${esc(t.id)}</b><span>${esc(t.ru)}</span></div>`).join(''):'<p class="muted">Совпадений в учебном словаре нет. Попробуйте поиск на вкладке «Словарь».</p>')};$('#refreshNews').onclick=loadFreshNews;$('#runTranslation').onclick=runTranslation;}
async function loadFreshNews(){const b=$('#refreshNews'),status=$('#newsStatus');b.disabled=true;status.textContent='Загружаем новости…';try{const r=await fetch('./indonesian-news.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Лента временно недоступна. Откройте сайт источника или загрузите свой текст.');const data=await r.json(),cat=$('#newsCategory').value;liveNews=(data.feeds[cat]?.items||[]).slice(0,12).map(n=>({...n,url:safeLink(n.url)}));if(!liveNews.length)throw Error('Для этого раздела пока нет новостей. Выберите другой раздел.');drawNews();status.textContent='Подборка обновлена: '+new Date(data.feeds[cat].updated).toLocaleString('ru-RU')+' · '+liveNews.length+' новостей';}catch(e){status.textContent=e.message}finally{b.disabled=false}}

function segments(s){const out=[];for(const paragraph of s.split(/\n+/).filter(x=>x.trim())){let current='';for(const token of paragraph.match(/\S+\s*/g)||[]){if(new TextEncoder().encode(current+token).length>480&&current){out.push(current.trim());current=''}for(const c of token){if(new TextEncoder().encode(current+c).length>480){out.push(current.trim());current=''}current+=c}}if(current.trim())out.push(current.trim())}return out}
async function runTranslation(){if(translating)return;if(!work.source.trim()){showToast('Добавьте исходный текст.');return}translating=true;const source=work.source,dir=work.dir;const controls=$$('#app button, #app select, #app textarea, #nav button, #mobileSection');controls.forEach(b=>b.disabled=true);const status=$('#assistStatus'),target=$('#assistTarget');const chunks=segments(source);let results=[];try{for(let i=0;i<chunks.length;i++){status.textContent=`Переводим фрагмент ${i+1} из ${chunks.length}…`;const endpoint=new URL('https://api.mymemory.translated.net/get');endpoint.searchParams.set('q',chunks[i]);endpoint.searchParams.set('langpair',dir+'|'+(dir==='id'?'ru':'id'));const r=await fetch(endpoint,{signal:AbortSignal.timeout(25000)});if(r.status===429)throw Error('Исчерпан суточный лимит MyMemory. Откройте текст в Google Переводчике.');if(!r.ok)throw Error('Сервис перевода временно недоступен. Используйте Google Переводчик.');const data=await r.json();if(Number(data.responseStatus)!==200||data.quotaFinished||!data.responseData?.translatedText)throw Error('Сервис не выполнил перевод. Используйте Google Переводчик.');results.push(decodeText(data.responseData.translatedText));}work.target=results.join('\n\n');target.value=work.target;saveWork();status.textContent='Черновик готов. Проверьте перевод и отредактируйте его справа.'}catch(e){status.textContent=e.message+' Ваш исходный текст и прежний перевод сохранены.'}finally{translating=false;controls.forEach(b=>b.disabled=false)}}

load();const section=new URLSearchParams(location.search).get('section');if(views.includes(section))state.view=section;$('#theme').onclick=()=>{const v=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('indonesian-theme',v)}catch(e){}};try{document.documentElement.setAttribute('data-theme',localStorage.getItem('indonesian-theme')||'dark')}catch(e){};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();showToast('Работа сохранена.')}if(e.key==='Escape'&&$('#toast'))$('#toast').hidden=true});render();setInterval(updateTimer,1000);
